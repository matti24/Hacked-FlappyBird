[project]
name = "neuroflap"
version = "1.0.0"
description = "NeuroFlap – eine KI lernt per Neuroevolution Flappy Bird zu spielen (from scratch)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
neuroflap = "neuroflap.simulation:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-depths"
version = "1.0.0"
description = "Dark Depths – ein prozedurales Roguelike mit smarter Gegner-KI (pygame)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dark-depths = "roguelike.game:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
